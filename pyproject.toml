[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mutantes-malfeitores-ia"
version = "0.1.0"
description = "Assistente experimental para construir poderes de Mutantes & Malfeitores 3e."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5",
  "ollama>=0.4",
  "sentence-transformers>=3.0",
  "unidecode>=1.3",
  "python-dotenv>=1.0",
  "openai>=2.0",
  "PyJWT[crypto]>=2.8",
  "keyring>=25.0",
  "requests>=2.31",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mm_ia = ["static/*.html", "static/*.css", "static/*.js"]

